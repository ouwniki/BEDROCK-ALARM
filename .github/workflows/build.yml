name: Build IronWake APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode Proyek
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Terima Lisensi Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Rakit Kode & Generate Audio Khas IronWake
        run: python3 setup_project.py

      - name: Buat Gradle Wrapper Otomatis
        run: gradle wrapper --gradle-version 8.2

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Unggah Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: IronWake-Alarm-APK
          path: app/build/outputs/apk/debug/app-debug.apk
